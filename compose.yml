# Desktop profile (RTX-class GPU with ~6 GB, 14+ GB RAM): gemma4:e4b answers on the GPU, the tev1 decision model runs on the CPU.
# Needs the NVIDIA container toolkit. Remove the devices block to run on CPU only (slow: use compose.slim.yml instead).
#   docker compose up -d      first start pulls ~13 GB of models, then http://127.0.0.1:8095
services:
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    healthcheck: { test: ["CMD", "ollama", "list"], interval: 5s, retries: 30 }
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  models:
    image: ollama/ollama
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    volumes: ["./decider.Modelfile:/decider.Modelfile:ro"]
    entrypoint: ["/bin/sh", "-c", "ollama pull bge-m3 && ollama pull ${CHAT_MODEL:-gemma4:e4b} && ollama pull tev1 && ollama create isakke-decider -f /decider.Modelfile"]
    depends_on: { ollama: { condition: service_healthy } }
    restart: "no"
  isakke:
    build: .
    ports: ["127.0.0.1:8095:8095"]
    environment:
      OLLAMA: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:e4b}
      DECIDER_MODEL: isakke-decider
    depends_on: { models: { condition: service_completed_successfully } }
volumes:
  ollama:
