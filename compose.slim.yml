# Slim profile (any CPU, x86 or ARM, ~2 GB RAM, no GPU): no generated answer. bge-m3 finds the closest paragraphs and shows them,
# pay questions are looked up at SCB, off-topic questions are refused by a similarity threshold. Nothing to hallucinate.
#   docker compose -f compose.slim.yml up -d      first start pulls ~1.2 GB, then http://127.0.0.1:8095
services:
  ollama:
    image: ollama/ollama
    mem_limit: 2g
    environment: { OLLAMA_KEEP_ALIVE: 24h, OLLAMA_MAX_LOADED_MODELS: "1" }
    volumes: [ollama:/root/.ollama]
    healthcheck: { test: ["CMD", "ollama", "list"], interval: 5s, retries: 30 }
  models:
    image: ollama/ollama
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["ollama", "pull", "bge-m3"]
    depends_on: { ollama: { condition: service_healthy } }
    restart: "no"
  isakke:
    build: .
    mem_limit: 256m
    ports: ["127.0.0.1:8095:8095"]
    environment: { OLLAMA: "http://ollama:11434", CHAT_MODEL: "", DECIDER_MODEL: "", MIN_SCORE: "0.48" }
    depends_on: { models: { condition: service_completed_successfully } }
volumes:
  ollama:
